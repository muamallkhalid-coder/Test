            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

ADNzMw9AAAAgA==', (gltf) => {
                gltfScene = gltf.scene;
                scene.add(gltfScene);
                
                // Center and scale
                const box = new THREE.Box3().setFromObject(gltfScene);
                const center = box.getCenter(new THREE.Vector3());
                gltfScene.position.sub(center);
                
                mixer = new THREE.AnimationMixer(gltfScene);
                if(gltf.animations.length > 0) {
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.clampWhenFinished = true;
                    action.loop = THREE.LoopOnce;
                }

                gltfScene.traverse((child) => {
                    if(child.isMesh && child.userData.part_id) {
                        partObjects[child.userData.part_id] = child;
                        createLabel(child.userData.part_id);
                    }
                });
            });
        }

        function createLabel(partId) {
            const partData = PARTS.find(p => p.id === partId);
            if(!partData) return;
            
            const div = document.createElement('div');
            div.className = 'label';
            div.textContent = partData.name.en;
            document.getElementById('labels-container').appendChild(div);
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            document.getElementById('lines-svg').appendChild(line);
            
            labels.push({ id: partId, div, line });
        }

        function toggleExplode(explode) {
            isExploded = explode;
            if(!mixer) return;
            const action = mixer.clipAction(mixer._root.animations[0]);
            action.paused = false;
            action.timeScale = explode ? 1 : -1;
            action.play();
            
            labels.forEach(l => l.div.style.display = explode ? 'block' : 'none');
            document.getElementById('lines-svg').style.display = explode ? 'block' : 'none';
        }

        function isolatePart(partId) {
            if(!isExploded) return;
            isolatedPart = partId;
            const partData = PARTS.find(p => p.id === partId);
            
            document.getElementById('info-title').textContent = partData.name.en;
            document.getElementById('info-material').textContent = partData.material;
            document.getElementById('info-qty').textContent = partData.qty;
            document.getElementById('info-desc').textContent = partData.description.en;
            document.getElementById('info-card').style.display = 'block';
            
            Object.values(partObjects).forEach(obj => {
                if(obj.userData.part_id !== partId) {
                    obj.material.transparent = true;
                    obj.material.opacity = 0.1;
                } else {
                    obj.material.transparent = false;
                    obj.material.opacity = 1.0;
                }
            });
        }

        function clearIsolation() {
            isolatedPart = null;
            document.getElementById('info-card').style.display = 'none';
            Object.values(partObjects).forEach(obj => {
                obj.material.transparent = false;
                obj.material.opacity = 1.0;
            });
        }

        function updateLabels() {
            if(!isExploded || isolatedPart) {
                labels.forEach(l => { l.div.style.display = 'none'; l.line.style.display = 'none'; });
                return;
            }
            
            labels.forEach(l => {
                const obj = partObjects[l.id];
                if(!obj) return;
                
                const pos = new THREE.Vector3();
                obj.getWorldPosition(pos);
                pos.project(camera);
                
                const x = (pos.x * .5 + .5) * window.innerWidth;
                const y = (pos.y * -.5 + .5) * window.innerHeight;
                
                l.div.style.display = 'block';
                l.div.style.left = x + 'px';
                l.div.style.top = (y - 30) + 'px';
                
                l.line.style.display = 'block';
                l.line.setAttribute('x1', x);
                l.line.setAttribute('y1', y - 30);
                l.line.setAttribute('x2', x);
                l.line.setAttribute('y2', y);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if(mixer) mixer.update(delta);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
    </script>
