function base64ToArrayBuffer(b64) {
  const binStr = atob(b64);
  const len = binStr.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binStr.charCodeAt(i);
  }
  return bytes.buffer;
}

function createLabelsUI() {

function loadEmbeddedGLB() {
  try {
    const buffer = base64ToArrayBuffer(GLB_BASE64);
    const loader = new GLTFLoader();
    loader.parse(buffer, '', (gltf) => {
      const root = gltf.scene;
      scene.add(root);

      const nameToPart = new Map();
      PARTS.forEach((p) => {
        (p.object_names || [p.id]).forEach((oname) => nameToPart.set(oname, p));
      });

      let matchedObjs = 0;
      root.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
          if (node.material) {
            node.material = node.material.clone();
            node.material.transparent = true;
          }
        }
        const matchedPart = nameToPart.get(node.name);
        if (matchedPart) {
          matchedObjs++;
          let exAxis = matchedPart.explode_axis;
          let exDist = matchedPart.explode_distance;
          let stg = matchedPart.stage;

          if (node.userData && Array.isArray(node.userData.explode_axis)) {
            exAxis = node.userData.explode_axis;
          } else if (node.name.includes('_left')) {
            if (Math.abs(exAxis[0]) > 0.5) exAxis = [-Math.abs(exAxis[0]), exAxis[1], exAxis[2]];
          } else if (node.name.includes('_right')) {
            if (Math.abs(exAxis[0]) > 0.5) exAxis = [Math.abs(exAxis[0]), exAxis[1], exAxis[2]];
          }
          if (node.name.includes('suction_')) {
            exAxis = [0, 0, -1];
          } else if (node.name.includes('discharge_')) {
            exAxis = [0, 0, 1];
          } else if (node.name.includes('clamp_bolt_bottom_')) {
            exAxis = [node.name.endsWith('_1') || node.name.endsWith('_2') ? -0.18 : 0.18, node.name.endsWith('_1') || node.name.endsWith('_3') ? -0.24 : 0.24, -0.95];
          } else if (node.name.includes('clamp_bolt_top_')) {
            exAxis = [node.name.endsWith('_1') || node.name.endsWith('_2') ? -0.18 : 0.18, node.name.endsWith('_1') || node.name.endsWith('_3') ? -0.24 : 0.24, 0.95];
          }
          if (node.userData && typeof node.userData.explode_distance === 'number') {
            exDist = node.userData.explode_distance;
          }

          const axisGltf = blenderVecToGltf(exAxis).normalize();
          const phase = (matchedObjs * 1.37) % (Math.PI * 2);

          partObjectsMap.get(matchedPart.id).push({
            obj: node,
            basePos: node.position.clone(),
            axisGltf,
            dist: exDist,
            stage: stg,
            phase
          });

          node.traverse((ch) => {
            if (ch.isMesh) meshToPartId.set(ch, matchedPart.id);
          });
        }
      });

      let groupsMatched = 0;
      PARTS.forEach((p) => {
        if ((partObjectsMap.get(p.id) || []).length > 0) {
          groupsMatched++;
        } else {
          debugLog.partsMissingMetadata.push(p.id);
        }
      });

      debugLog.glbLoaded = true;
      debugLog.partsMatchedInGLB = groupsMatched;
      debugLog.matchedObjectCount = matchedObjs;

      createLabelsUI();
      frameObject(root, false);
    }, (err) => {
      recordError('GLTFLoader parse error: ' + err);
    });
  } catch (err) {
    recordError('loadEmbeddedGLB exception: ' + err);
  }
}

// ============================================================================
// 6. STAGGERED KINEMATICS, FLOATING BOB & MATERIAL HIGHLIGHT/GHOSTING
// ============================================================================
function smoothstep(u) {
  const c = Math.max(0.0, Math.min(1.0, u));
  return c * c * (3.0 - 2.0 * c);
}

function stageFactor(progress, stage, maxStage = 6) {
  const span = 0.36;
  const stagger = (1.0 - span) / Math.max(1, maxStage - 1);
  const tStart = (stage - 1) * stagger;
  const tEnd = tStart + span;
  if (progress <= tStart) return 0.0;
  if (progress >= tEnd) return 1.0;
  return smoothstep((progress - tStart) / (tEnd - tStart));
}

function updatePartTransforms(nowSec) {
  if (animStartTime !== null) {
    const elapsed = nowSec - animStartTime;
    const u = Math.min(1.0, elapsed / ANIM_DURATION_S);
    const eased = smoothstep(u);
    explodeProgress = animStartProgress + (targetExplode - animStartProgress) * eased;
    if (u >= 1.0) {
      explodeProgress = targetExplode;
      animStartTime = null;
    }
  }

  const bobScale = explodeProgress > 0.85 ? (explodeProgress - 0.85) / 0.15 : 0.0;

  PARTS.forEach((part) => {
    const entries = partObjectsMap.get(part.id) || [];
    entries.forEach((entry) => {
      const sf = stageFactor(explodeProgress, entry.stage);
      const disp = entry.axisGltf.clone().multiplyScalar(entry.dist * sf);
      if (bobScale > 0.0 && entry.dist > 0.0) {
        const dy = Math.sin(nowSec * 2.1 + entry.phase) * BOB_AMPLITUDE * bobScale;
        disp.y += dy;
      }
      entry.obj.position.copy(entry.basePos).add(disp);
    });
  });
}

function refreshMaterials() {
  meshToPartId.forEach((partId, mesh) => {
    const mat = mesh.material;
    if (!mat) return;
    const isIsolated = (isolatedPartId !== null);
    const isSelected = (isolatedPartId === partId);
    const isHovered = (hoveredPartId === partId);

    if (isIsolated && !isSelected) {
      mat.opacity = 0.12;
      mat.depthWrite = false;
    } else {
      mat.opacity = 1.0;
      mat.depthWrite = true;
    }

    if (mat.emissive) {
      if (isHovered || isSelected) {
        mat.emissive.setHex(0x0ea5e9);
        mat.emissiveIntensity = isSelected ? 0.35 : 0.25;
      } else {
        mat.emissive.setHex(0x000000);
        mat.emissiveIntensity = 0.0;
      }
    }
  });

  labelDomMap.forEach((dom, partId) => {
    dom.chipEl.classList.toggle('active', partId === isolatedPartId || partId === hoveredPartId);
  });
}

// ============================================================================
// 7. TWO-COLUMN SORTED NON-CROSSING LABELS & SVG LEADER LINES
// ============================================================================
const raycaster = new THREE.Raycaster();

function updateLabelsOverlay() {
  const showLabels = (explodeProgress > 0.28) && (isolatedPartId === null);
  const w = window.innerWidth;
  const h = window.innerHeight;

  if (!showLabels) {
    labelDomMap.forEach(({ chipEl, lineEl, dotEl }) => {
      chipEl.style.display = 'none';
      lineEl.style.display = 'none';
      dotEl.style.display = 'none';
    });
    return;
  }

  const leftItems = [];
  const rightItems = [];

  PARTS.forEach((part) => {
    const entries = partObjectsMap.get(part.id) || [];
    const dom = labelDomMap.get(part.id);
    if (!dom || entries.length === 0) return;

    const anchorGltf = blenderVecToGltf(part.anchor).add(entries[0].obj.position);
    const proj = anchorGltf.clone().project(camera);

    if (proj.z > 1.0 || proj.z < -1.0) {
      dom.chipEl.style.display = 'none';
      dom.lineEl.style.display = 'none';
      dom.dotEl.style.display = 'none';
      return;
    }

    const sx = (proj.x * 0.5 + 0.5) * w;
    const sy = (-proj.y * 0.5 + 0.5) * h;

    const item = { part, dom, sx, sy };
    if (sx < w * 0.5) {
      leftItems.push(item);
    } else {
      rightItems.push(item);
    }
  });

  leftItems.sort((a, b) => a.sy - b.sy);
  rightItems.sort((a, b) => a.sy - b.sy);

  const topMargin = 88;
  const botMargin = h - 92;

  function layoutColumn(items, isLeft) {
    const n = items.length;
    if (n === 0) return;
    const minSpacing = Math.min(38, Math.max(24, (botMargin - topMargin) / Math.max(1, n)));
    const colX = isLeft ? Math.max(95, w * 0.13) : Math.min(w - 95, w * 0.87);

    const ys = items.map(it => Math.max(topMargin, Math.min(botMargin, it.sy)));
    for (let i = 1; i < n; i++) {
      if (ys[i] < ys[i - 1] + minSpacing) {
        ys[i] = ys[i - 1] + minSpacing;
      }
    }
    if (ys[n - 1] > botMargin) {
      ys[n - 1] = botMargin;
      for (let i = n - 2; i >= 0; i--) {
        if (ys[i] > ys[i + 1] - minSpacing) {
          ys[i] = Math.max(topMargin, ys[i + 1] - minSpacing);
        }
      }
    }

    items.forEach((it, idx) => {
      const ly = ys[idx];
      const { chipEl, lineEl, dotEl } = it.dom;
      chipEl.style.display = 'block';
      chipEl.style.left = `${colX}px`;
      chipEl.style.top = `${ly}px`;

      const elbowX = isLeft ? colX + 58 : colX - 58;
      const attachX = isLeft ? colX + 42 : colX - 42;

      lineEl.style.display = 'block';
      lineEl.setAttribute('points', `${it.sx.toFixed(1)},${it.sy.toFixed(1)} ${elbowX.toFixed(1)},${ly.toFixed(1)} ${attachX.toFixed(1)},${ly.toFixed(1)}`);

      dotEl.style.display = 'block';
      dotEl.setAttribute('cx', it.sx.toFixed(1));
      dotEl.setAttribute('cy', it.sy.toFixed(1));
    });
  }

  layoutColumn(leftItems, true);
  layoutColumn(rightItems, false);
}

// ============================================================================
// 8. PART ISOLATION, CAMERA FRAMING & UI CONTROLS
// ============================================================================
function startCameraTween(targetPos, targetLookAt, durationS = 0.65) {
  camTween = {
    startTime: performance.now() / 1000.0,
    duration: durationS,
    fromPos: camera.position.clone(),
    toPos: targetPos.clone(),
    fromTarget: controls.target.clone(),
    toTarget: targetLookAt.clone()
  };
}

function frameObject(objOrArray, animate = true) {
  const box = new THREE.Box3();
  if (Array.isArray(objOrArray)) {
    objOrArray.forEach(e => box.expandByObject(e.obj));
  } else {
    box.setFromObject(objOrArray);
  }
  if (box.isEmpty()) return;

  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z, 0.08);
  const dist = maxDim * 2.15;
  const dir = new THREE.Vector3(0.62, 0.34, 0.72).normalize();
  const newPos = center.clone().add(dir.multiplyScalar(dist));

  if (animate) {
    startCameraTween(newPos, center, 0.65);
  } else {
    camera.position.copy(newPos);
    controls.target.copy(center);
    controls.update();
  }
}

function setHoveredPart(partId) {
  if (hoveredPartId === partId) return;
  hoveredPartId = partId;
  refreshMaterials();
}

function populateInfoCard(part) {
  const card = document.getElementById('info-card');
  if (!part) {
    card.classList.remove('visible');
    return;
  }
  document.getElementById('ic-name').textContent = part.name[currentLang] || part.name.en;
  document.getElementById('ic-group').textContent = part.group;
  document.getElementById('ic-mat').textContent = part.material;
  document.getElementById('ic-qty').textContent = String(part.qty);
  document.getElementById('ic-stage').textContent = `Stage ${part.stage} / 6`;
  document.getElementById('ic-motion').textContent = part.moving ? `Moving (${part.motion_description})` : 'Static';
  document.getElementById('ic-desc').textContent = part.description[currentLang] || part.description.en;
  document.getElementById('ic-func').textContent = part.function[currentLang] || part.function.en;
  card.classList.add('visible');
}

function isolatePart(partId) {
  const part = partRecordsById.get(partId);
  if (!part) return;
  isolatedPartId = partId;
  refreshMaterials();
  populateInfoCard(part);
  const entries = partObjectsMap.get(partId) || [];
  if (entries.length > 0) {
    frameObject(entries, true);
  }
}

function clearIsolation() {
  if (isolatedPartId === null) return;
  isolatedPartId = null;
  refreshMaterials();
  populateInfoCard(null);
  const overviewDist = explodeProgress > 0.5 ? 1.55 : 1.05;
  startCameraTween(
    defaultCamPos.clone().normalize().multiplyScalar(overviewDist),
    defaultCamTarget,
    0.65
  );
}

let pointerDownXY = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownXY = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointermove', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const meshes = Array.from(meshToPartId.keys());
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    const pId = meshToPartId.get(hits[0].object);
    setHoveredPart(pId || null);
    renderer.domElement.style.cursor = 'pointer';
  } else {
    setHoveredPart(null);
    renderer.domElement.style.cursor = 'grab';
  }
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownXY) return;
  const dx = e.clientX - pointerDownXY.x;
  const dy = e.clientY - pointerDownXY.y;
  pointerDownXY = null;
  if (Math.hypot(dx, dy) > 6) return;

  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const meshes = Array.from(meshToPartId.keys());
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    const pId = meshToPartId.get(hits[0].object);
    if (pId) isolatePart(pId);
  } else {
    clearIsolation();
  }
});

document.getElementById('btn-explode').addEventListener('click', () => {
  isolatedPartId = null;
  populateInfoCard(null);
  refreshMaterials();
  animStartProgress = explodeProgress;
  targetExplode = 1.0;
  animStartTime = performance.now() / 1000.0;
  startCameraTween(new THREE.Vector3(1.12, 0.48, 1.38), defaultCamTarget, 1.2);
});

document.getElementById('btn-assemble').addEventListener('click', () => {
  isolatedPartId = null;
  populateInfoCard(null);
  refreshMaterials();
  animStartProgress = explodeProgress;
  targetExplode = 0.0;
  animStartTime = performance.now() / 1000.0;
  startCameraTween(defaultCamPos, defaultCamTarget, 1.1);
});

document.getElementById('btn-reset-cam').addEventListener('click', () => {
  clearIsolation();
  const mult = explodeProgress > 0.5 ? 1.45 : 1.0;
  startCameraTween(defaultCamPos.clone().multiplyScalar(mult), defaultCamTarget, 0.6);
});

document.getElementById('btn-back').addEventListener('click', () => {
  clearIsolation();
});

document.getElementById('btn-lang').addEventListener('click', () => {
  currentLang = (currentLang === 'en') ? 'ar' : 'en';
  document.documentElement.lang = currentLang;
  document.documentElement.dir = (currentLang === 'ar') ? 'rtl' : 'ltr';
  labelDomMap.forEach((dom, partId) => {
    const part = partRecordsById.get(partId);
    if (part) updateChipText(dom.chipEl, part);
  });
  if (isolatedPartId) {
    populateInfoCard(partRecordsById.get(isolatedPartId));
  }
});

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2400);
}

document.getElementById('btn-debug').addEventListener('click', async () => {
  const payload = JSON.stringify(debugLog, null, 2);
  try {
    await navigator.clipboard.writeText(payload);
    showToast('Debug info copied to clipboard');
  } catch (err) {
    recordError('Clipboard write failed: ' + err);
    showToast('Debug info logged to console');
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================================
// 9. MAIN RENDER LOOP
// ============================================================================
function animate() {
  requestAnimationFrame(animate);
  const nowSec = performance.now() / 1000.0;

  if (camTween) {
    const u = Math.min(1.0, (nowSec - camTween.startTime) / camTween.duration);
    const e = smoothstep(u);
    camera.position.lerpVectors(camTween.fromPos, camTween.toPos, e);
    controls.target.lerpVectors(camTween.fromTarget, camTween.toTarget, e);
    if (u >= 1.0) camTween = null;
  }

  updatePartTransforms(nowSec);
  controls.update();
  renderer.render(scene, camera);
  updateLabelsOverlay();
}

loadEmbeddedGLB();
animate();
</script>
